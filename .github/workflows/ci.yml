name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/skymap-web/.nvmrc
          cache: npm
          cache-dependency-path: apps/skymap-web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install scons fonttools==4.60.2 brotli==1.2.0 pytest

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.2
          actions-cache-folder: emsdk-cache

      - name: Build engine (WASM)
        run: ./build-engine.sh

      - name: Web layer
        working-directory: apps/skymap-web
        run: |
          npm ci
          npm run lint
          npx vitest run
          npm run build

      - name: Packaging script tests
        run: python3 -m pytest tools/tests/test_make_dist_zip.py tools/tests/test_install_dist.py -q
